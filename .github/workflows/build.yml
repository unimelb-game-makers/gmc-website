name: Build

on:
  pull_request:
    branches:
      - main  # or your default branch
      - deployment

jobs:
  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Set environment variables
      - name: Set Notion env vars
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PROJECTS: ${{ secrets.NOTION_PROJECTS }}
          NOTION_COMMITTEE_INFO: ${{ secrets.NOTION_COMMITTEE_INFO }}
          NOTION_COMMITTEE_YEAR: ${{ secrets.NOTION_COMMITTEE_YEAR }}
          NOTION_EDUCATION: ${{ secrets.NOTION_EDUCATION }}
        run: echo "Environment variables set"

      # 5. Run Next.js build
      - name: Build Next.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PROJECTS: ${{ secrets.NOTION_PROJECTS }}
          NOTION_COMMITTEE_INFO: ${{ secrets.NOTION_COMMITTEE_INFO }}
          NOTION_COMMITTEE_YEAR: ${{ secrets.NOTION_COMMITTEE_YEAR }}
          NOTION_EDUCATION: ${{ secrets.NOTION_EDUCATION }}
        run: npm run build